<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Single-Source Retrieval</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <!-- ================= SIDEBAR ================= -->
    <aside class="sidebar">
        <header class="brand">
            <h1>Single-Source</h1>
            <p class="brand-sub">Ask one document</p>
        </header>
        <section id="doc-panel" class="panel">
            <div id="dropzone" class="dropzone" tabindex="0" role="button" aria-label="Upload a PDF">
                <svg viewBox="0 0 24 24" class="dz-icon" aria-hidden="true">
                    <path d="M12 16V4m0 0L8 8m4-4 4 4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" />
                </svg>
                <p class="dz-title">Drop a PDF here</p>
                <p class="dz-hint">or click to browse &middot; max 50 MB</p>
                <input type="file" id="file-input" accept="application/pdf" hidden />
            </div>
            <div id="upload-progress" class="progress hidden">
                <div class="bar"><span id="progress-fill"></span></div>
                <p id="progress-label">Uploading…</p>
            </div>
            <div id="doc-meta" class="doc-meta hidden">
                <p class="doc-name" id="doc-name"></p>
                <p class="doc-stats" id="doc-stats"></p>
                <button id="clear-doc" class="link-btn" type="button">Use another document</button>
            </div>
        </section>
        <section id="topics-panel" class="panel hidden">
            <h2 class="panel-title">Topics in this document</h2>
            <ul id="topics-list" class="topics"></ul>
        </section>
        <footer class="sidebar-foot">
            <label class="toggle">
                <input type="checkbox" id="tts-toggle" />
                <span>Read answers aloud</span>
            </label>
            <a href="/docs" target="_blank" rel="noopener" class="link-btn">API docs</a>
        </footer>
    </aside>
    <!-- ================= MAIN ================= -->
    <main class="main">
        <div id="messages" class="messages" aria-live="polite">
            <div class="empty-state" id="empty-state">
                <h2>Upload a PDF to begin</h2>
                <p>Everything you ask will be answered from that document alone,
                    with the source passages shown beside each answer.</p>
            </div>
        </div>
        <div id="suggestions" class="suggestions hidden" aria-label="Suggested questions"></div>
        <form id="composer" class="composer" autocomplete="off">
            <button type="button" id="mic-btn" class="icon-btn" title="Ask by voice" aria-label="Ask by voice" disabled>
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z" />
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v3" />
                </svg>
            </button>
            <textarea id="question" rows="1" placeholder="Ask a question about the document…" disabled
                aria-label="Your question"></textarea>
            <button type="submit" id="send-btn" class="icon-btn primary" aria-label="Send question" disabled>
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z" />
                </svg>
            </button>
        </form>
        <p id="status-line" class="status-line"></p>
    </main>
    <div id="toast" class="toast hidden" role="alert"></div>
    <script src="app.js"></script>
</body>

</html>
